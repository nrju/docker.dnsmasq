name: CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  call-docker-workflow:
    name: Call docker workflow
    uses: nrju/docker/.github/workflows/ci.yml@v1.0.0
    with:
      DOCKER_NAME: "dnsmasq"
      DOCKER_TAG: "2.92.1"
      PUBLISH: ${{ github.event_name == 'release' }}
